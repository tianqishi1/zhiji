<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知几 · Personal Agent (M0)</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#2d333b;--text:#e6edf3;--dim:#8b949e;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff;--chip:#21262d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;padding:20px;max-width:1080px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:var(--chip);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px}
.chip b{color:var(--acc)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 18px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-bottom-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;border-radius:4px;padding:1px 8px;border:1px solid var(--border);color:var(--dim)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.fast{color:var(--ok)}
.dim{color:var(--dim);font-size:12px}
button{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--acc)}
button.primary{background:#1f6feb;border-color:#1f6feb}
button.danger{color:var(--bad)}
.check{font-family:Consolas,monospace;font-size:12px;padding:2px 0}
.check .p{color:var(--ok)}.check .f{color:var(--bad)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--dim);font-size:12px}
pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;overflow:auto;margin-top:6px;white-space:pre-wrap}
input,textarea,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;width:100%}
textarea{font-family:Consolas,monospace;min-height:64px}
.form{display:grid;gap:8px;margin-bottom:14px}
.section-title{font-size:13px;color:var(--dim);margin:14px 0 8px;text-transform:uppercase;letter-spacing:1px}
.empty{color:var(--dim);padding:20px;text-align:center}
.mem-kind{font-size:11px;color:var(--acc)}
</style>
</head>
<body>
<h1>知几 <span class="dim">zhiji · Eval-Native Personal Agent · M0</span></h1>
<div class="sub">每次交付都带核验回执 · 评测器与技能同生 · verdict 即自进化的奖励信号</div>
<div class="metrics" id="metrics"></div>
<div class="tabs">
  <div class="tab on" data-t="today">今日</div>
  <div class="tab" data-t="tasks">任务</div>
  <div class="tab" data-t="memory">记忆</div>
  <div class="tab" data-t="skills">技能</div>
</div>
<div id="view"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,method="GET",body){const r=await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});return r.json();}
let TAB="today",SKILLS=[];
const STATUS={delivered:["✓ 已交付","ok"],failed:["✗ 未通过","bad"],rejected:["⊘ 已拒绝","bad"],awaiting_confirmation:["⏸ 待确认","warn"],queued:["… 排队",""],planning:["… 规划",""],executing:["… 执行",""],evaluating:["… 评测",""]};
function routeBadge(r){if(!r)return"";const fast=r==="connector"||r==="replay";return `<span class="badge ${fast?"fast":""}">${fast?"快路径":"慢路径"}·${esc(r)}</span>`;}
function checksHtml(v){if(!v||!v.checks||!v.checks.length)return `<div class="dim">判定来源：${esc(v?.decided_by||"-")} ${esc(v?.reason||"")}</div>`;
 return v.checks.map(c=>`<div class="check"><span class="${c.pass?"p":"f"}">${c.pass?"✓":"✗"}</span> ${esc(c.id)}: <span class="dim">${esc(c.expr)}</span>${c.error?` <span class="f">${esc(c.error)}</span>`:""}</div>`).join("");}
function taskCard(t,full){const[st,cls]=STATUS[t.status]||[t.status,""];const v=t.verdict;
 return `<div class="card"><div class="row"><h3>${esc(t.title)}</h3><span class="badge ${cls}">${st}</span>${routeBadge(t.route)}
 ${v?`<span class="badge ${v.pass?"ok":"bad"}">核验${v.pass?"通过":"未过"}·${esc(v.decided_by)}</span>`:""}
 <span class="dim">${t.cost_tokens} tokens · ${t.cost_ms}ms · ${esc(t.skill_id)} v${t.skill_version}</span></div>
 ${t.status==="awaiting_confirmation"?confHtml(t):""}
 ${v?`<details ${full?"open":""}><summary>核验回执（证据 + 断言）</summary>${checksHtml(v)}<pre>${esc(JSON.stringify(t.receipt?.evidence?.artifacts||[],null,1))}</pre></details>`:""}
 ${full?`<details><summary>完整轨迹</summary><pre id="traj-${t.id}">加载中…</pre></details>`:""}
 <div class="row" style="margin-top:8px">
  ${["delivered","failed"].includes(t.status)?`<button onclick="fb('${t.id}','up')">有用 👍</button><button class="danger" onclick="fb('${t.id}','down')">不对 👎</button>`:""}
  <span class="dim">${new Date(t.created_at*1000).toLocaleString("zh-CN")}</span></div></div>`;}
function confHtml(t){const c=(CONFS||[]).find(x=>x.task_id===t.id&&x.status==="pending");if(!c)return"";
 return `<div class="card" style="background:var(--bg);margin-top:8px"><div class="dim">敏感动作「${esc(c.action)}」需要你的确认：</div>
 <pre>${esc(JSON.stringify(c.preview,null,1))}</pre>
 <div class="row" style="margin-top:6px"><button class="primary" onclick="resolve('${c.id}',true)">批准执行</button>
 <button class="danger" onclick="resolve('${c.id}',false)">拒绝</button><span class="dim">拒绝原因会回流记忆</span></div></div>`;}
let CONFS=[];
async function resolve(id,ok){const reason=ok?"":(prompt("拒绝原因（可选，会写入记忆）：")||"");await api(`/api/confirmations/${id}/resolve`,"POST",{approve:ok,reason});refresh();}
async function fb(id,signal){const note=signal==="down"?(prompt("哪里不对？（可选，触发重探索）")||""):"";await api(`/api/tasks/${id}/feedback`,"POST",{signal,note});refresh();}
async function promote(id){const r=await api(`/api/skills/${id}/promote`,"POST");alert(r.promoted?"回归通过，已晋升快路径 ✓":"回归未通过："+JSON.stringify(r.regression.failed||r.regression.reason));refresh();}
async function submitTask(){try{const params=JSON.parse($("#p-params").value||"{}");const r=await api("/api/tasks","POST",{skill_id:$("#p-skill").value,params,title:$("#p-title").value||undefined});if(r.error)alert(r.error);refresh();}catch(e){alert("params 不是合法 JSON");}}
async function addMem(){await api("/api/memories","POST",{kind:$("#m-kind").value,content:$("#m-content").value,source:"user"});$("#m-content").value="";refresh();}
async function editMem(id,old){const c=prompt("编辑记忆：",old);if(c!==null){await api(`/api/memories/${id}`,"PATCH",{content:c});refresh();}}
async function delMem(id){await api(`/api/memories/${id}`,"DELETE");refresh();}
async function diary(){const r=await api("/api/consolidate","POST");alert(r.diary.content);refresh();}
function metricsHtml(m){return [["免干预完成率",m.north_star_no_touch_rate+"%"],["核验通过率",m.verification_pass_rate+"%"],["快路径覆盖",m.fast_path_coverage+"%"],["平均成本",m.avg_cost_tokens+" tok / "+m.avg_cost_ms+"ms"],["待确认",m.awaiting_confirmation],["误动作事故",m.incidents]].map(([k,v])=>`<span class="chip">${k} <b>${v}</b></span>`).join("");}
async function render(){
 const view=$("#view");
 if(TAB==="today"){const d=await api("/api/today");CONFS=await api("/api/confirmations?status=pending");$("#metrics").innerHTML=metricsHtml(d.metrics);
  view.innerHTML=`<div class="section-title">待确认（${d.awaiting.length}）</div>${d.awaiting.map(t=>taskCard(t)).join("")||'<div class="empty">没有待确认的敏感动作</div>'}
  <div class="section-title">已完成（${d.done.length}）</div>${d.done.map(t=>taskCard(t)).join("")||'<div class="empty">今天还没有任务</div>'}
  <div class="section-title">进行中（${d.active.length}）</div>${d.active.map(t=>taskCard(t)).join("")||'<div class="empty">无</div>'}`;}
 else if(TAB==="tasks"){const ts=await api("/api/tasks");$("#metrics").innerHTML=metricsHtml(await api("/api/metrics"));
  view.innerHTML=`<div class="card form"><div class="row"><select id="p-skill">${SKILLS.map(s=>`<option value="${s.id}">${esc(s.contract.title)}（${s.id}）</option>`).join("")}</select></div>
  <input id="p-title" placeholder="任务标题（可选）"><textarea id="p-params" placeholder='params JSON，如 {"item":"降噪耳机 WH-1000XM6","target_price":1500}'>{}</textarea>
  <div><button class="primary" onclick="submitTask()">提交任务</button></div></div>${ts.map(t=>taskCard(t,true)).join("")}`;
  ts.forEach(async t=>{const el=$(`#traj-${t.id}`);if(el){const d=await api(`/api/tasks/${t.id}`);el.textContent=d.trajectory.map(e=>`[${e.kind}] ${JSON.stringify(e.payload)}`).join("\n");}});}
 else if(TAB==="memory"){const ms=await api("/api/memories");
  view.innerHTML=`<div class="card form"><div class="row"><select id="m-kind"><option value="profile">画像</option><option value="preference">偏好</option><option value="correction">纠错</option></select>
  <button onclick="diary()">今晚写日记（记忆巩固）</button></div><textarea id="m-content" placeholder="添加一条记忆（用户可控，带来源）"></textarea><div><button class="primary" onclick="addMem()">添加</button></div></div>
  ${ms.map(m=>`<div class="card"><div class="row"><span class="mem-kind">[${esc(m.kind)}]</span><span>${esc(m.content)}</span>${m.locked?'<span class="badge warn">锁定</span>':""}</div>
  <div class="row" style="margin-top:6px"><span class="dim">来源：${esc(m.source||"-")} · 置信度 ${m.confidence}</span>
  <button onclick="editMem('${m.id}','${esc(m.content).replace(/'/g,"\\'")}')">编辑</button><button class="danger" onclick="delMem('${m.id}')">删除</button></div></div>`).join("")||'<div class="empty">还没有记忆</div>'}`;}
 else if(TAB==="skills"){const ss=await api("/api/skills");SKILLS=ss;
  view.innerHTML=ss.map(s=>{const st=s.stats||{};const runs=st.runs||0;const rate=runs?Math.round((st.pass||0)/runs*100):0;
  return `<div class="card"><div class="row"><h3>${esc(s.contract.title)}</h3><span class="badge ${s.status==="active"?"ok":s.status==="demoted"?"bad":"warn"}">${esc(s.status)}</span><span class="dim">${s.id} v${s.version}</span></div>
  <div class="row dim" style="margin-top:6px"><span class="chip">运行 ${runs}</span><span class="chip">成功率 ${rate}%</span><span class="chip">快路径 ${st.fast||0}</span><span class="chip">累计 ${st.tokens||0} tokens</span><span class="chip">回归 ${st.regression?(st.regression.pass?"✓ "+st.regression.total+" 例":"✗ 未过"):"未跑"}</span></div>
  <details><summary>三件套契约（执行器+评测器+数据契约）</summary><pre>${esc(JSON.stringify(s.contract,null,1))}</pre></details>
  <div class="row" style="margin-top:8px"><button onclick="promote('${s.id}')">跑回归门 / 晋升</button><span class="dim">连续失败 ${s.fail_streak} 次（≥2 自动降级）</span></div></div>`;}).join("");}
}
async function refresh(){SKILLS=await api("/api/skills");await render();}
document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));el.classList.add("on");TAB=el.dataset.t;render();});
refresh();setInterval(()=>{if(TAB==="today")render();},5000);
</script>
</body>
</html>
